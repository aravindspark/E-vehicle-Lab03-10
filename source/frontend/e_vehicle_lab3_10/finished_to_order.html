<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - E-Vehicle Share</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
    background-color: #e6f7f1;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.btn-custom {
    background-color: #8BC34A;
    border: none;
    color: white;
    transition: background-color 0.3s ease;
}

.btn-custom:hover {
    background-color: #C0CA33;
}

.navbar {
    background-color: #8BC34A;
    padding: 10px 20px;
}

.navbar .nav-link {
    color: white;
    font-weight: 500;
    margin-right: 15px;
}

.navbar .nav-link:hover {
    color: #CDDC39;
}


        .vehicle-container {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        .vehicle-container img {
            width: 20%;
            height: auto;
            margin-right: 20px;
        }
        .vehicle-info {
            font-size: 16px;
            line-height: 1.5;
        }
        .vehicle-info h3 {
            margin: 0 0 10px 0;
        }
        .buttom-top {
          margin-top: 65%;
          margin-bottom: 5%;
        }
        .image{
          width: 100px;
          height: 100px;
          margin-left: 5%;
          margin-top: 3%;
        }
  </style>
  <script>
    function finishOrder(button) {
      button.innerText = "Order Finished";
      button.classList.remove("btn-success");
      button.classList.add("btn-secondary"); 
      button.disabled = true; 
  }
    function back1(button){
      window.location.href = './index.html';
    }
  </script>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">E-Vehicle Share</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="rent.html">Rent</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="order.html">Order</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container mt-5">
    <h2 class="text-left mb-4">Payment</h2>
  </div>
  
  <div class="container mt-5">
    
    <form>
      <div class="container mt-4">
          <div class="row justify-content-left">
              <!-- 车辆信息卡片 -->
              <div class="col-md-6" id="select_pay">
                  <div class="card">
                      <img src="./images/1.png" class="card-img-top image" alt="user">
                      <div class="card-body">
                          <h5 id="vehicle-name">Tesla Model 3</h5>
                          <p id="used-time"></p>
                          <p id="need-to-pay"></p>
                          <p id="discount"></p>
                          <p id="unit_price"></p>
                          <p id="battery"></p>
                          <h5 class="text-left mb-4">Select a way to pay</h5>
                          <div class="form-check mb-3">
                              <input class="form-check-input" type="radio" name="paymentOption" id="balance" checked>
                              <label class="form-check-label" for="balance">
                                  Use balance (money in your account)
                              </label>
                          </div>
                          <div class="form-check mb-3">
                              <input class="form-check-input" type="radio" name="paymentOption" id="creditCard">
                              <label class="form-check-label" for="creditCard">
                                  Use credit card
                              </label>
                          </div>
                      </div>
                  </div>
              </div>
              <div class="col-md-6" id="detail_pay">
                  <div class="card">
                      <div class="card-body">
                          <h2 id="totalpay"></h2>
                          <p>Use Hour: 3h</p>
                          <p>Test 1</p>
                          <p>Use Discount</p>
                          <p>Right Bottom()</p>
                      </div>
                      <div class="card-footer text-right">
                          <button type="submit" class="btn btn-success w-100" onclick="finishOrder(this)">Confirm Order</button>
                      </div>
                      <div class="card-footer text-right">
                        <button type="button" class="btn btn-success w-100" onclick="back1(this)">Back</button>
                    </div>
                  </div>
              </div>
          </div>
      </div>
  </form>
  
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const unitPrice = parseFloat(params.get('unit_price'));
    const discount = parseFloat(params.get('discount'));
    const hoursOfUse = parseFloat(params.get('hours'));
    const total = parseFloat(params.get('total'));
    const battery = parseFloat(params.get('battery'));
    console.log('Unit Price:', unitPrice);
    console.log('Discount:', discount);
    console.log('Hours of Use:', hoursOfUse);
    console.log('Total:', total);
    console.log('battery:', battery);
    document.getElementById('used-time').innerText = `Used time: ${hoursOfUse}h`;
    document.getElementById('need-to-pay').innerText = `Need to pay: $${total.toFixed(2)}`;
    document.getElementById('discount').innerText = `Discount: $${discount.toFixed(2)}`;
    document.getElementById('unit_price').innerText = `Unit price per hour: $${unitPrice.toFixed(2)}`;
    document.getElementById('battery').innerText = `the power of the battery: ${battery}%`;
    document.getElementById('totalpay').innerText = `Need to pay: $${total.toFixed(2)}`;
  </script>
  
</body>
</html>
