<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - E-Vehicle Share</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
    background-color: #e6f7f1;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.btn-custom {
    background-color: #8BC34A;
    border: none;
    color: white;
    transition: background-color 0.3s ease;
}

.btn-custom:hover {
    background-color: #C0CA33;
}

.navbar {
    background-color: #8BC34A;
    padding: 10px 20px;
}

.navbar .nav-link {
    color: white;
    font-weight: 500;
    margin-right: 15px;
}

.navbar .nav-link:hover {
    color: #CDDC39;
}


        .vehicle-container {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        .vehicle-container img {
            width: 20%;
            height: auto;
            margin-right: 20px;
        }
        .vehicle-info {
            font-size: 16px;
            line-height: 1.5;
        }
        .vehicle-info h3 {
            margin: 0 0 10px 0;
        }
        .buttom-top {
          margin-top: 65%;
          margin-bottom: 5%;
        }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">E-Vehicle Share</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="rent.html">Rent</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="order.html">Order</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container mt-5">
    <h2 class="text-left mb-4">Payment</h2>
  </div>
  
  <div class="container mt-5">
    
    <form>
      <div class="row justify-content-left" style="border-style:solid">
        <div class="col-md-6" id="select_pay">
          <div id="E-Vehicle_picture" class="container mt-4 vehicle-container">
            <img src="./images/1.png" class="img-fluid mb-4" alt="user" height="20%" width="20%">
            <div class="vehicle-info">
              <h3>Tesla Model 3</h3>
              <p>Price per hour: $100</p>
              <p>Battery Status: 85%</p>
              <p>Location: Downtown Station</p>
          </div>
          </div>
          <h5 class="text-left mb-4">Selcet a way to pay</h5>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="paymentOption" id="balance" checked>
            <label class="form-check-label" for="balance">
              use balance(money in your account)
            </label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="paymentOption" id="creditCard">
            <label class="form-check-label" for="creditCard">
              use credit card
            </label>
          </div>
          
        </div>
        <div class="col-md-6" id="detail_pay" style="border-style:solid" >
          <div class="container col-md-offset-3" style="border-style:solid">
            <h2 class=" text-center mt-4"> total_pay:300</h2>
            <p>use_hour:3h</p>
            <p>test1</p>
            <p>use_discount</p>
            <p>right_bottom()</p>
          </div>
          <div style="text-align:right"class="container buttom-top">
            <button type="submit" class="btn btn-success w-30 margin-right">confirm order</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- 引入 Bootstrap JS -->
  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
