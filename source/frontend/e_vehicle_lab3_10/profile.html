<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - E-Vehicle Share</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    .profile-container, .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px;
    }

    .profile-container {
      background-color: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-custom {
      background-color: #8BC34A;
      border: none;
      color: white;
      transition: background-color 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #CDDC39;
    }

    .navbar {
      background-color: #8BC34A;
      position: absolute;
      top: 0;
      width: 100%;
      padding: 15px 20px;
    }

    .navbar .navbar-brand {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .profile-title {
      color: #333;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
    }

    .profile-info {
      font-size: 1.1rem;
      color: #555;
      text-align: left; /* 将内容左对齐 */
    }

    .image-container {
      background-image: url('images/register.jpg'); /* 使用与login页面相同的图片路径 */
      background-size: cover;
      background-position: center;
    }

  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">E-Vehicle Share</a>
    </div>
  </nav>

  <!-- Left Side: Profile Content -->
  <div class="profile-container">
    <div class="container">
      <h2 class="profile-title">This is me!</h2>
      <div class="text-center mt-4">
        <img id="avatarPreview" class="avatar mb-3" src="" alt="Avatar">
      </div>

      <div class="profile-info mb-3">
        <strong>Name:</strong> <span id="displayName"></span>
      </div>

      <div class="profile-info mb-3">
        <strong>Email:</strong> <span id="displayEmail"></span>
      </div>

      <div class="profile-info mb-3">
        <strong>Location:</strong> <span id="displayLocation"></span>
      </div>

      <div class="profile-info mb-3">
        <strong>Birthday:</strong> <span id="displayBirthday"></span>
      </div>

      <div class="text-center mt-4">
        <a href="edit_profile.html" class="btn btn-primary btn-custom">Edit Profile</a>
      </div>
    </div>
  </div>

  <!-- Right Side: Image Background -->
  <div class="image-container"></div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    window.onload = function() {
      fetch('/api/profile')
        .then(response => response.json())
        .then(data => {
          document.getElementById('avatarPreview').src = data.avatar;
          document.getElementById('displayName').innerText = data.name;
          document.getElementById('displayEmail').innerText = data.email;
          document.getElementById('displayLocation').innerText = data.location;
          document.getElementById('displayBirthday').innerText = data.birthday;
        })
        .catch(error => console.error('Error loading profile data:', error));
    };
  </script>
</body>
</html>
