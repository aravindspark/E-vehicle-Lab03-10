<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta tags for responsiveness and character encoding -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Vehicles</title>
  <!-- Bootstrap CSS -->
  <link href="./css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <style>
    .status-badge {
      border-radius: 15px;
      padding: 5px 10px;
    }

    .status-issue {
      background-color: #ffcccc;
      color: #e60000;
    }

    .status-no-issue {
      background-color: #ccffcc;
      color: #008000;
    }

    .battery-status {
      font-size: 0.9em;
    }
    #map {
      height: 500px; /* Adjust the height as needed */
      width: 100%;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">E-Vehicle Share</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Navbar links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Page Manager</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Rent</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Return</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Account</a></li>
        </ul>
        <!-- Logout button -->
        <a class="btn btn-outline-danger" href="index.html">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container mt-5">
    <!-- Add New Vehicle Button -->
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addVehicleModal">Add New
      Vehicle</button>
    <h2>All Vehicles:</h2>
    <!-- Filters -->
    <div class="d-flex align-items-center mb-3">
      <!-- Filter by Type -->
      <div class="me-3">
        <label for="filter-type" class="form-label">Filter by Type</label>
        <select id="filter-type" class="form-select">
          <option value="0">All Types</option>
          <!-- Options are dynamically populated -->
        </select>
      </div>

      <!-- Filter by Status -->
      <div class="me-3">
        <label for="filter-status" class="form-label">Filter by Status</label>
        <select id="filter-status" class="form-select">
          <option value="0">All Status</option>
          <!-- Options are dynamically populated -->
        </select>
      </div>

      <!-- Apply Filters Button -->
      <button id="apply-filters" class="btn btn-primary">Apply Filters</button>
    </div>

    <div id="map" style="height: 500px; width: 100%;"></div>



    <!-- Vehicle Information Table -->
    <h2 class="text-center">Vehicle Information Table</h2>
    <table class="table table-bordered table-striped">
      <thead class="table-light">
        <tr>
          <th>Image</th>
          <th>Model</th>
          <th>Status</th>
          <th>Battery</th>
          <th>Location</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="vehicle-table-body"></tbody>
    </table>

    <!-- Pagination Controls and Rows-per-Page Selector -->
    <div class="d-flex justify-content-between align-items-center mt-3">
      <!-- Rows-per-Page Selector -->
      <div class="d-flex align-items-center">
        <label for="rows-per-page" class="me-2 mb-0">Each page shows:</label>
        <select id="rows-per-page" class="form-control w-auto">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
      <!-- Pagination Controls -->
      <nav>
        <ul class="pagination mb-0" id="pagination-controls"></ul>
      </nav>
    </div>
  </div>

  <!-- Modal for Adding New Vehicle -->
  <div class="modal fade" id="addVehicleModal" tabindex="-1" aria-labelledby="addVehicleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Modal Header -->
        <div class="modal-header">
          <h5 class="modal-title" id="addVehicleModalLabel">Add New Vehicle</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!-- Modal Body -->
        <div class="modal-body">
          <form id="add-vehicle-form">
            <!-- Vehicle Type Options -->
            <div class="mb-3">
              <label for="vehicle-type" class="form-label">Vehicle Type</label>
              <select id="vehicle-type" class="form-select" required>
                <option value="">Select Vehicle Type</option>
              </select>
            </div>
            <!-- Vehicle Status Options -->
            <div class="mb-3">
              <label class="form-label">Vehicle Status</label>
              <div id="vehicle-status-container"></div>
            </div>
            <!-- Current Location -->
            <div class="mb-3">
              <label for="vehicle-location" class="form-label">Current Location</label>
              <input type="text" id="vehicle-location" class="form-control" placeholder="Enter location" required>
            </div>
            <!-- Battery Level -->
            <div class="mb-3">
              <label for="battery-level" class="form-label">Battery Level (%)</label>
              <input type="range" id="battery-level" class="form-range" min="0" max="100" value="100"
                oninput="document.getElementById('battery-level-display').innerText = this.value + '%'">
              <span id="battery-level-display">100%</span>
            </div>
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Add Vehicle</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="./js/bootstrap.min.js"></script>
  <!-- Main JS Script -->
  <script type="module" src="./js/operator.js"></script>
  <!-- Google Maps JavaScript API -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCslggYN9083AFtqYZeK6D3toY606bhqig"></script>
</body>

</html>
